[package]
name = "murmurd"
version = "0.1.0"
edition = "2021"
description = "murmur daemon — BLE remote shell + agent backend for Raspberry Pi"
license = "MIT"

[[bin]]
name = "murmurd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "time", "signal"] }
portable-pty = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# BLE peripheral support is Linux/BlueZ-only.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
